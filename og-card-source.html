<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500;1,9..144,650&family=Hanken+Grotesk:wght@600;700&display=swap');
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: linear-gradient(135deg, #1C3729 0%, #244734 100%);
    padding: 60px 64px 56px;
    font-family: 'Hanken Grotesk', sans-serif;
    display: flex; flex-direction: column;
  }
  .blob { position: absolute; border-radius: 50%; background: #2E5340; opacity: .55; }
  .blob1 { width: 460px; height: 460px; right: -130px; top: -180px; }
  .blob2 { width: 320px; height: 320px; left: -150px; bottom: -140px; opacity: .4; }
  .head { display: flex; align-items: center; gap: 22px; position: relative; }
  .chip { width: 92px; height: 92px; border-radius: 50%; background: #F7F2E7; display: grid; place-items: center; }
  .brand .name { font-family: 'Fraunces', serif; font-style: italic; font-weight: 650; font-size: 42px; color: #FAF6EF; }
  .brand .prof { margin-top: 6px; font-size: 19px; font-weight: 700; letter-spacing: 5px; color: #A8C3AC; }
  .mid { position: relative; margin-top: auto; }
  h1 { font-family: 'Fraunces', serif; font-style: italic; font-weight: 650; font-size: 67px; line-height: 1.14; color: #F5EFE2; }
  h1 .gold { color: #E7BB60; }
  .voce { margin-top: 20px; font-family: 'Fraunces', serif; font-style: italic; font-weight: 500; font-size: 33px; color: #F5EFE2; }
  .voce::before { content: ''; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #E7BB60; margin-right: 14px; vertical-align: 6px; }
  .info { margin-top: 22px; font-size: 25px; font-weight: 600; color: #C9DCCB; }
  .pill { margin-top: 26px; display: inline-flex; align-items: center; gap: 12px; background: #25D366; color: #fff; font-weight: 700; font-size: 24px; padding: 15px 30px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="blob blob1"></div>
  <div class="blob blob2"></div>
  <div class="head">
    <div class="chip">
      <svg viewBox="0 0 48 48" width="60" height="60">
        <path d="M10 31 C16 28 21 28 24 30.5 C27 28 32 28 38 31 L38 39 C32 36 27 36 24 38.5 C21 36 16 36 10 39 Z" fill="#244734"/>
        <path d="M24 30.5 V38.5" stroke="#82af89" stroke-width="1.3"/>
        <path d="M24 14 C22 10.5 16.5 11.5 16.5 15.5 C16.5 19 21 22 24 24 C27 22 31.5 19 31.5 15.5 C31.5 11.5 26 10.5 24 14 Z" fill="#E7BB60"/>
      </svg>
    </div>
    <div class="brand">
      <div class="name">Thais Azevedo</div>
      <div class="prof">NEUROPSICOPEDAGOGA</div>
    </div>
  </div>
  <div class="mid">
    <h1>Ajudando crianças a<br><span class="gold">aprender com confiança</span></h1>
    <div class="voce">Você não está só!</div>
    <div class="info">Avaliação e intervenção neuropsicopedagógica · São Paulo, SP</div>
    <div class="pill">Agende pelo WhatsApp</div>
  </div>
</body>
</html>
